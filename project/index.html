<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdfdfd;
        --fg: #111;
        --accent: #2563eb;
        --border: #d9d9d9;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .app {
        width: min(960px, 100%);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      header h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .note-form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1rem;
        background: rgba(0, 0, 0, 0.02);
        border: 1px solid var(--border);
        border-radius: 1rem;
      }

      .note-form input,
      .note-form textarea {
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        font: inherit;
        resize: vertical;
      }

      .note-form button {
        align-self: flex-start;
        border: none;
        border-radius: 0.75rem;
        background: var(--accent);
        color: white;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      .note-form button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .notes-panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .panel-head button {
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        opacity: 0.7;
      }

      ul.notes {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        margin: 0;
        padding: 0;
      }

      .note-card {
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background: white;
      }

      .note-card header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .note-card h3 {
        margin: 0;
        font-size: 1.1rem;
      }

      .note-card small {
        color: #555;
      }

      .note-card textarea {
        border: none;
        resize: vertical;
        font: inherit;
        padding: 0.25rem;
        background: transparent;
      }

      .empty {
        border: 1px dashed var(--border);
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
        color: #6b7280;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --fg: #f9fafb;
          --border: #1f2937;
        }

        .note-form,
        .note-card,
        .empty {
          background: #0f172a;
        }

        .note-card small {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <p class="eyebrow">Workspace</p>
        <h1>My Notes</h1>
        <p>
          Capture quick thoughts and keep them handy. Everything saves locally
          in your browser.
        </p>
      </header>

      <form class="note-form" id="note-form">
        <input
          type="text"
          id="note-title"
          placeholder="Note title"
          required
          maxlength="80"
        />
        <textarea
          id="note-body"
          rows="4"
          placeholder="Write your note..."
          required
        ></textarea>
        <button type="submit" id="save-note" disabled>Add note</button>
      </form>

      <section class="notes-panel">
        <div class="panel-head">
          <h2>Saved notes</h2>
          <button type="button" id="clear-all">Clear all</button>
        </div>
        <div id="notes-empty" class="empty" hidden>
          <p>No notes yet. Create your first note above.</p>
        </div>
        <ul class="notes" id="notes-list"></ul>
      </section>
    </div>

    <template id="note-template">
      <li class="note-card">
        <header>
          <h3></h3>
          <button type="button" class="delete">✕</button>
        </header>
        <small></small>
        <textarea></textarea>
      </li>
    </template>

    <script>
      const form = document.getElementById("note-form");
      const titleInput = document.getElementById("note-title");
      const bodyInput = document.getElementById("note-body");
      const saveBtn = document.getElementById("save-note");
      const list = document.getElementById("notes-list");
      const emptyState = document.getElementById("notes-empty");
      const clearAllBtn = document.getElementById("clear-all");
      const template = document.getElementById("note-template");

      const STORAGE_KEY = "note-app-items";

      function loadNotes() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : [];
        } catch (error) {
          console.error("Failed to read notes", error);
          return [];
        }
      }

      function saveNotes(notes) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        } catch (error) {
          console.error("Failed to persist notes", error);
        }
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(date));
      }

      function render(notes) {
        list.innerHTML = "";
        emptyState.hidden = notes.length !== 0;

        const fragment = document.createDocumentFragment();
        notes.forEach((note) => {
          const node = template.content.cloneNode(true);
          const card = node.querySelector(".note-card");
          card.dataset.id = note.id;
          node.querySelector("h3").textContent = note.title;
          node.querySelector("small").textContent =
            `Updated ${formatDate(note.updatedAt)}`;
          const textarea = node.querySelector("textarea");
          textarea.value = note.body;
          textarea.addEventListener("change", (event) => {
            updateNoteBody(note.id, event.target.value);
          });
          node
            .querySelector(".delete")
            .addEventListener("click", () => deleteNote(note.id));
          fragment.appendChild(node);
        });

        list.appendChild(fragment);
      }

      function updateFormState() {
        saveBtn.disabled = !titleInput.value.trim() || !bodyInput.value.trim();
      }

      function addNote(note) {
        const notes = loadNotes();
        notes.unshift(note);
        saveNotes(notes);
        render(notes);
      }

      function deleteNote(id) {
        const notes = loadNotes().filter((note) => note.id !== id);
        saveNotes(notes);
        render(notes);
      }

      function updateNoteBody(id, body) {
        const notes = loadNotes().map((note) =>
          note.id === id ? { ...note, body, updatedAt: Date.now() } : note,
        );
        saveNotes(notes);
        render(notes);
      }

      function clearAll() {
        localStorage.removeItem(STORAGE_KEY);
        render([]);
      }

      form.addEventListener("input", updateFormState);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const note = {
          id: crypto.randomUUID(),
          title: titleInput.value.trim(),
          body: bodyInput.value.trim(),
          createdAt: Date.now(),
          updatedAt: Date.now(),
        };

        addNote(note);
        form.reset();
        updateFormState();
        titleInput.focus();
      });

      clearAllBtn.addEventListener("click", () => {
        if (confirm("Delete all notes?")) {
          clearAll();
        }
      });

      render(loadNotes());
      updateFormState();
    </script>
  </body>
</html>
