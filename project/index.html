<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Our Landing Page</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --accent: #2563eb;
        --bg: #f8fafc;
        --fg: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(37, 99, 235, 0.15), transparent 60%),
          var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .card {
        max-width: 720px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.2);
        padding: 3rem;
        text-align: center;
        backdrop-filter: blur(12px);
      }

      h1 {
        font-size: clamp(2.5rem, 6vw, 3.5rem);
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.2rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: none;
        background: linear-gradient(120deg, #2563eb, #7c3aed);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: transform 150ms ease, box-shadow 150ms ease;
        box-shadow: 0 15px 35px rgba(37, 99, 235, 0.3);
      }

      .cta:hover {
        transform: translateY(-3px);
        box-shadow: 0 25px 45px rgba(37, 99, 235, 0.4);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 1rem;
        margin-top: 3rem;
      }

      .metric {
        padding: 1.2rem;
        border-radius: 16px;
        background: rgba(37, 99, 235, 0.08);
      }

      .metric h3 {
        margin: 0;
        font-size: 1.4rem;
      }

      .metric span {
        color: rgba(15, 23, 42, 0.7);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Build Experiences People Love</h1>
      <p>
        Launch fast, iterate confidently, and offer delightful experiences from day one.
        Our platform gives you the tools to ship modern web experiences without the overhead.
      </p>
      <a class="cta" href="#get-started">Get Early Access →</a>
      <section class="metrics">
        <div class="metric">
          <h3>2K+</h3>
          <span>Teams onboarded</span>
        </div>
        <div class="metric">
          <h3>99.99%</h3>
          <span>Uptime guarantee</span>
        </div>
        <div class="metric">
          <h3>120+</h3>
          <span>Global data regions</span>
        </div>
      </section>
    </main>
  </body>
</html>
