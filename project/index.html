<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --border: rgba(0, 0, 0, 0.15);
        --bg: #f8fafc;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: #0f172a;
        padding: 1.5rem;
      }

      .game {
        width: min(420px, 100%);
        background: var(--panel);
        border-radius: 1.5rem;
        padding: 2rem;
        box-shadow: 0 15px 45px rgba(15, 23, 42, 0.15);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .game__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .game__title {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .status {
        font-size: 1rem;
        color: #475569;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.8rem;
      }

      .cell {
        width: 100%;
        aspect-ratio: 1 / 1;
        border: none;
        border-radius: 0.75rem;
        background: #e2e8f0;
        font-size: clamp(2.5rem, 8vw, 3.25rem);
        font-weight: 700;
        color: #0f172a;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.3s ease;
      }

      .cell:disabled {
        cursor: default;
      }

      .cell:not(:disabled):hover {
        transform: translateY(-2px);
        background: #cbd5f5;
      }

      .cell.winner {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .scoreboard {
        display: flex;
        gap: 1rem;
        font-weight: 600;
        color: #1e293b;
      }

      .scoreboard span {
        font-size: 0.95rem;
      }

      .btn {
        border: none;
        padding: 0.85rem 1.5rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:hover {
        background: var(--primary-dark);
      }

      @media (max-width: 480px) {
        .game {
          padding: 1.5rem;
        }

        .controls {
          flex-direction: column;
        }

        .scoreboard {
          width: 100%;
          justify-content: space-between;
        }

        .btn {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="game" aria-label="Tic Tac Toe">
      <header class="game__header">
        <h1 class="game__title">Tic Tac Toe</h1>
        <p class="status" id="status" aria-live="polite">Player X's turn</p>
      </header>

      <section class="board" role="grid" aria-label="Game board">
        <button class="cell" data-cell role="gridcell" aria-label="Row 1 column 1"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 1 column 2"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 1 column 3"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 2 column 1"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 2 column 2"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 2 column 3"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 3 column 1"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 3 column 2"></button>
        <button class="cell" data-cell role="gridcell" aria-label="Row 3 column 3"></button>
      </section>

      <div class="controls">
        <div class="scoreboard" aria-label="Scoreboard">
          <span>X: <strong id="score-x">0</strong></span>
          <span>O: <strong id="score-o">0</strong></span>
          <span>Draw: <strong id="score-draw">0</strong></span>
        </div>
        <button class="btn" id="reset">Reset Game</button>
      </div>
    </main>

    <script>
      const cells = Array.from(document.querySelectorAll('[data-cell]'));
      const statusEl = document.getElementById('status');
      const resetBtn = document.getElementById('reset');
      const scoreXEl = document.getElementById('score-x');
      const scoreOEl = document.getElementById('score-o');
      const scoreDrawEl = document.getElementById('score-draw');

      const scores = { X: 0, O: 0, draw: 0 };
      let currentPlayer = 'X';
      let board = Array(9).fill('');
      let isGameOver = false;

      const winningCombos = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      function updateStatus(message) {
        statusEl.textContent = message;
      }

      function updateScores() {
        scoreXEl.textContent = scores.X;
        scoreOEl.textContent = scores.O;
        scoreDrawEl.textContent = scores.draw;
      }

      function handleCellClick(event) {
        const cell = event.currentTarget;
        const index = cells.indexOf(cell);

        if (board[index] || isGameOver) {
          return;
        }

        board[index] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.setAttribute('aria-label', `${cell.getAttribute('aria-label')} - ${currentPlayer}`);

        const winningCombo = getWinningCombo();
        if (winningCombo) {
          highlightWinner(winningCombo);
          scores[currentPlayer] += 1;
          updateScores();
          updateStatus(`Player ${currentPlayer} wins!`);
          isGameOver = true;
          disableBoard();
          return;
        }

        if (board.every(Boolean)) {
          scores.draw += 1;
          updateScores();
          updateStatus(`It's a draw!`);
          isGameOver = true;
          disableBoard();
          return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus(`Player ${currentPlayer}'s turn`);
      }

      function getWinningCombo() {
        return winningCombos.find(([a, b, c]) => {
          return board[a] && board[a] === board[b] && board[a] === board[c];
        });
      }

      function highlightWinner(combo) {
        combo.forEach((index) => cells[index].classList.add('winner'));
      }

      function disableBoard() {
        cells.forEach((cell) => (cell.disabled = true));
      }

      function enableBoard() {
        cells.forEach((cell) => (cell.disabled = false));
      }

      function resetBoard(options = { resetScores: false }) {
        board = Array(9).fill('');
        isGameOver = false;
        currentPlayer = 'X';
        cells.forEach((cell, index) => {
          cell.textContent = '';
          cell.classList.remove('winner');
          cell.disabled = false;
          const baseLabel = `Row ${Math.floor(index / 3) + 1} column ${(index % 3) + 1}`;
          cell.setAttribute('aria-label', baseLabel);
        });
        updateStatus(`Player ${currentPlayer}'s turn`);

        if (options.resetScores) {
          scores.X = 0;
          scores.O = 0;
          scores.draw = 0;
          updateScores();
        }
      }

      resetBtn.addEventListener('click', () => resetBoard({ resetScores: true }));
      cells.forEach((cell) => cell.addEventListener('click', handleCellClick));
    </script>
  </body>
</html>
